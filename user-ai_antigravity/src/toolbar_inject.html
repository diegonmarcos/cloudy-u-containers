<meta name="viewport" id="viewport-meta" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
  body.mobile-mode #terminal {
    padding-bottom: 52px !important;
  }
  body.desktop-mode #terminal {
    padding-bottom: 0px !important;
  }

  #view-mode-toggle {
    position: fixed;
    top: 10px;
    right: 14px;
    height: 30px;
    padding: 0 12px;
    background: rgba(30, 30, 36, 0.85);
    backdrop-filter: blur(8px);
    color: #a1a1aa;
    border: 1px solid #52525b;
    border-radius: 9999px;
    font-size: 11px;
    font-weight: 700;
    font-family: monospace;
    cursor: pointer;
    z-index: 999999;
    display: flex;
    align-items: center;
    gap: 5px;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #view-mode-toggle:active {
    background: #3b82f6;
    color: #fff;
  }

  #mobile-touch-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 46px;
    background: rgba(18, 18, 22, 0.95);
    backdrop-filter: blur(12px);
    border-top: 1px solid #3f3f46;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    overflow-x: auto;
    white-space: nowrap;
    z-index: 999998;
    -webkit-overflow-scrolling: touch;
  }
  body.desktop-mode #mobile-touch-bar {
    display: none !important;
  }
  #mobile-touch-bar::-webkit-scrollbar {
    display: none;
  }
  .mob-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 36px;
    min-width: 44px;
    padding: 0 10px;
    background: #27272a;
    color: #f4f4f5;
    border: 1px solid #52525b;
    border-radius: 6px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .mob-btn:active {
    background: #3b82f6;
    color: #ffffff;
    transform: scale(0.95);
  }
</style>

<button id="view-mode-toggle" onclick="toggleViewMode()">📱 MOBILE</button>

<div id="mobile-touch-bar">
  <button class="mob-btn" onpointerdown="termSendKey('\x1b')">ESC</button>
  <button class="mob-btn" onpointerdown="termSendKey('\t')">TAB</button>
  <button class="mob-btn" onpointerdown="termSendKey('\x03')">^C</button>
  <button class="mob-btn" onpointerdown="termSendKey('\x04')">^D</button>
  <button class="mob-btn" onpointerdown="termSendKey('\x1b[A')">▲</button>
  <button class="mob-btn" onpointerdown="termSendKey('\x1b[B')">▼</button>
  <button class="mob-btn" onpointerdown="termSendKey('\x1b[D')">◀</button>
  <button class="mob-btn" onpointerdown="termSendKey('\x1b[C')">▶</button>
  <button class="mob-btn" onpointerdown="termSendKey('|')">|</button>
  <button class="mob-btn" onpointerdown="termSendKey('~')">~</button>
  <button class="mob-btn" onpointerdown="termSendKey('/')">/</button>
  <button class="mob-btn" onpointerdown="termSendKey('-')">-</button>
  <button class="mob-btn" onpointerdown="termSendKey('\r')">↵</button>
</div>

<script>
  let ttydSocket = null;
  const NativeWebSocket = window.WebSocket;
  window.WebSocket = function(...args) {
    const ws = new NativeWebSocket(...args);
    ws.addEventListener('open', () => { ttydSocket = ws; });
    return ws;
  };
  window.WebSocket.prototype = NativeWebSocket.prototype;

  window.termSendKey = function(sequence) {
    if (ttydSocket && ttydSocket.readyState === WebSocket.OPEN) {
      ttydSocket.send('0' + sequence);
    }
    const input = document.querySelector('.xterm-helper-textarea') || document.querySelector('textarea');
    if (input) input.focus();
  };

  let isMobileView = localStorage.getItem('agy_view_mode') !== 'desktop';

  function applyViewMode() {
    const btn = document.getElementById('view-mode-toggle');
    const vp = document.getElementById('viewport-meta');
    if (isMobileView) {
      document.body.classList.remove('desktop-mode');
      document.body.classList.add('mobile-mode');
      btn.innerText = '📱 MOBILE';
      if (vp) vp.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
    } else {
      document.body.classList.remove('mobile-mode');
      document.body.classList.add('desktop-mode');
      btn.innerText = '💻 DESKTOP';
      if (vp) vp.setAttribute('content', 'width=1280, user-scalable=yes');
    }
    window.dispatchEvent(new Event('resize'));
  }

  function toggleViewMode() {
    isMobileView = !isMobileView;
    localStorage.setItem('agy_view_mode', isMobileView ? 'mobile' : 'desktop');
    applyViewMode();
  }

  document.addEventListener('DOMContentLoaded', applyViewMode);
  setTimeout(applyViewMode, 300);
</script>
