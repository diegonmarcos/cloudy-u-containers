name: caddy validate guard (plugin build)

# #1896: the hub Caddyfile is validated by a Caddy built exactly like the image (src/code/Dockerfile:
# xcaddy + caddy-l4 + caddy-ratelimit + caddy-dns/cloudflare), nothing stripped, plus a runtime check of the
# authenticated rate limit. Runs on source pushes, after every render-dist run (its GITHUB_TOKEN push does
# not trigger push workflows), and on demand -- run it and see it green before an infra-sec_caddy Ship.
# #1897: the same binary also carries the edge image's geolocation module (union of both Dockerfiles'
# plugins), so the public-edge Caddyfile (infra-sec_caddy-public dist + render) is validated here too, and
# test-real-client-ip.sh proves at runtime that the hub believes a PROXY header / X-Forwarded-For only from
# the front edge -- run it green before an infra-sec_caddy or infra-sec_caddy-public Ship.
# #1897 incident: test-two-caddy-chain.sh runs BOTH committed Caddyfiles as the real chain (front edge layer4 passthrough
# -> hub layer4 :443 -> hub :8443) in network namespaces, with the built binary and the live image binaries; it must be
# red on the incident pair (hub ab0d1a95 + edge 9004ff89) and green on main.
on:
  push:
    branches: [main]
    paths: ['infra-sec_caddy/**', 'infra-sec_caddy-public/**', '_shared/edge-auth.*', '.github/workflows/caddy-validate-guard.yml']
  workflow_run:
    workflows: ["render-dist (re-render one service's committed dist/ in CI and push it)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloudy-t-infra
          path: _cloud-infra
          sparse-checkout: 1_cloud-configs/dist
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: cachix/install-nix-action@v27
      - name: Build Caddy like the images (xcaddy, union of the hub and edge src/code/Dockerfile plugins)
        run: |
          set -eu
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
          plugins=$(grep -ho 'with github.com/[^ ]*' infra-sec_caddy/src/code/Dockerfile infra-sec_caddy-public/src/code/Dockerfile | sort -u | sed 's/^with /--with /' | tr '\n' ' ')
          echo "plugins: $plugins"
          "$(go env GOPATH)/bin/xcaddy" build $plugins --output "$RUNNER_TEMP/caddy"
          "$RUNNER_TEMP/caddy" version
      - name: Validate dist + render, runtime check of the authenticated rate limit
        env:
          MULTI_SSO_JSON_DIR: ${{ github.workspace }}/_cloud-infra/1_cloud-configs/dist
        run: CADDY="$RUNNER_TEMP/caddy" bash infra-sec_caddy/src/test/test-caddy-validate-plugins.sh
      - name: Rendered-text guard (#1896)
        env:
          MULTI_SSO_JSON_DIR: ${{ github.workspace }}/_cloud-infra/1_cloud-configs/dist
          ALLOW_STALE_DIST: ${{ github.event_name == 'push' && '1' || '0' }}
        run: bash infra-sec_caddy/src/test/test-authed-rate-limit.sh
      - name: Fetch the edge's pinned country database (checksum verified, _shared/geo-fence.json)
        run: |
          set -eu
          J=_shared/geo-fence.json
          curl -fsSL "$(jq -r .db.url "$J")" -o "$RUNNER_TEMP/country.mmdb.gz"
          echo "$(jq -r .db.sha256 "$J")  $RUNNER_TEMP/country.mmdb.gz" | sha256sum -c -
          gunzip -c "$RUNNER_TEMP/country.mmdb.gz" > "$RUNNER_TEMP/country.mmdb"
      - name: Real client IP guard (#1897) - rendered text, both validates, runtime
        env:
          MULTI_SSO_JSON_DIR: ${{ github.workspace }}/_cloud-infra/1_cloud-configs/dist
          ALLOW_STALE_DIST: ${{ github.event_name == 'push' && '1' || '0' }}
        run: CADDY="$RUNNER_TEMP/caddy" GEO_DB_FILE="$RUNNER_TEMP/country.mmdb" bash infra-sec_caddy/src/test/test-real-client-ip.sh
      - name: Live image binaries (the hub's pinned image, the edge's image) for the chain test
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for s in hub:infra-sec_caddy edge:infra-sec_caddy-public; do
            who="${s%%:*}"; img="$(grep '^{' "${s#*:}/dist/compose/docker-compose.yml" | jq -r '.services[].image')"
            docker pull -q "$img"; docker create --name "c2c-$who" "$img" >/dev/null
            docker cp "c2c-$who:/usr/bin/caddy" "$RUNNER_TEMP/caddy-$who-live"; docker rm "c2c-$who" >/dev/null
            echo "$who image $img = $(docker image inspect --format '{{index .RepoDigests 0}} created {{.Created}}' "$img")"
            "$RUNNER_TEMP/caddy-$who-live" build-info | grep -E '^(go|path|mod|dep\s+github.com/(mholt/caddy-l4|caddyserver/caddy/v2|pires/go-proxyproto|mastercactapus))'
          done
      - name: Two-Caddy chain (#1897 incident) - red on the incident pair (hub ab0d1a95 + edge 9004ff89), green on main
        if: ${{ !cancelled() }}
        env:
          GEO_DB_FILE: ${{ runner.temp }}/country.mmdb
        run: |
          set -u +e
          git fetch -q --depth 1 origin ab0d1a9514b2de7026b0cdbd8c696650d1c21574 9004ff89710b3f634db3a7b0f11d3f16be05e01f
          git show ab0d1a9514b2de7026b0cdbd8c696650d1c21574:infra-sec_caddy/dist/configs/Caddyfile > "$RUNNER_TEMP/hub-incident.caddy"
          git show 9004ff89710b3f634db3a7b0f11d3f16be05e01f:infra-sec_caddy-public/dist/configs/Caddyfile > "$RUNNER_TEMP/edge-incident.caddy"
          T=infra-sec_caddy/src/test/test-two-caddy-chain.sh; rc=0
          sets="built:$RUNNER_TEMP/caddy:$RUNNER_TEMP/caddy"
          [ -x "$RUNNER_TEMP/caddy-hub-live" ] && [ -x "$RUNNER_TEMP/caddy-edge-live" ] && sets="$sets live:$RUNNER_TEMP/caddy-hub-live:$RUNNER_TEMP/caddy-edge-live"
          for s in $sets; do
            IFS=: read -r name hb eb <<< "$s"
            echo "::group::[$name] incident pair (must be red: passthrough TLS fails)"
            CADDY_HUB="$hb" CADDY_EDGE="$eb" HUB_CADDYFILE="$RUNNER_TEMP/hub-incident.caddy" EDGE_CADDYFILE="$RUNNER_TEMP/edge-incident.caddy" bash "$T" > "$RUNNER_TEMP/inc.log" 2>&1; irc=$?
            cat "$RUNNER_TEMP/inc.log"; echo "::endgroup::"
            if [ "$irc" -ne 0 ] && grep -q '^RESULT: passthrough-tls-failed' "$RUNNER_TEMP/inc.log"; then echo "ok: [$name] the incident pair is red (passthrough TLS fails), as live on 2026-11-24"
            else echo "FAIL: [$name] the incident pair did not reproduce the passthrough TLS failure (rc $irc)"; rc=1; fi
            echo "::group::[$name] committed dists (must be green)"
            CADDY_HUB="$hb" CADDY_EDGE="$eb" bash "$T"; mrc=$?; echo "::endgroup::"
            if [ "$mrc" -eq 0 ]; then echo "ok: [$name] committed dists pass the chain"; else echo "FAIL: [$name] committed dists fail the chain"; rc=1; fi
          done
          exit $rc
