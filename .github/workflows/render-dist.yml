name: render-dist (re-render one service's committed dist/ in CI and push it)

# Ship's Build job fails when a service's committed dist/ differs from a fresh render of src/
# (step_verify_committed_dist). This workflow produces that render in CI so nobody needs a local build:
# same layout as tokens-api-render (cloud-infra's 1_cicd + 1_cloud-configs/dist beside this repo checked
# out as infra/a_solutions, nix on the runner), `./build.sh build` for the ONE named service, then a
# commit of changes under <service>/dist/ only. Anything else changed => red, nothing pushed.
# Pushes to main with the built-in GITHUB_TOKEN (no extra secret). A GITHUB_TOKEN push does not trigger
# dispatch-cloud-infra, so this workflow dispatches the courier itself at the end (2026-11-18): at the
# render commit, or at the source commit when dist/ is already fresh. The courier hands every push that
# changes a service's render inputs to this workflow (courier_before/courier_after set) instead of
# shipping it, so Ship only ever sees a commit whose dist matches src. If a chained run cannot finish
# the render, the courier is still dispatched at the source commit (the pre-2026-11-18 behaviour), so
# no change goes unannounced and Ship's drift guard keeps the verdict.
on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service directory name (e.g. infra-api_cloud-infra-mcp); several space-separated when the courier hands over a multi-service push"
        required: true
      keep_committed:
        description: "Optional: space-separated paths under <service>/dist/ restored to the committed version after the render. For a service whose compose carries vault secret mounts (the public checkout cannot render them): the compose stays as committed, every other dist file is re-rendered."
        required: false
        default: ""
      reinject_secret_mounts:
        description: "Optional: true = after the render, put back the secret mounts (volumes /run/secrets, env_file .secrets) that the committed compose has and the public render dropped, so the compose is re-rendered (names, ports, healthchecks) and the mounts stay. Use instead of keep_committed when the compose itself changed."
        required: false
        default: "false"
      repo:
        description: "Repository holding the service (this workflow lives in cloudy-u-containers)"
        required: false
        default: "cloudy-u-containers"
      courier_before:
        description: "Set by the courier: the original push's before, passed back so Ship sees the whole range"
        required: false
        default: ""
      courier_after:
        description: "Set by the courier: the pushed commit it did not ship"
        required: false
        default: ""
      courier:
        description: "false = render and commit only; do NOT dispatch the courier (no Ship). For a change held for an explicit, approved Ship (#1886: auth-plane hardening). Ignored on courier-chained runs."
        required: false
        default: "true"

permissions:
  contents: write
  actions: write   # dispatch the courier (dispatch-cloud-infra.yml) once dist matches src

concurrency:
  group: render-dist
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SERVICES: ${{ inputs.service }}
      COURIER_BEFORE: ${{ inputs.courier_before }}
      COURIER_AFTER: ${{ inputs.courier_after }}
      TARGET_REPO: ${{ inputs.repo }}
      KEEP_COMMITTED: ${{ inputs.keep_committed }}
      REINJECT: ${{ inputs.reinject_secret_mounts }}
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Validate inputs
        id: validate
        run: |
          set -eu
          [ -n "$(printf '%s' "$SERVICES" | tr -d ' ')" ] || { echo "::error::service is empty"; exit 1; }
          n=0
          for SERVICE in $SERVICES; do
            printf '%s' "$SERVICE" | grep -Eq '^[a-z0-9][a-z0-9_-]{1,80}$' || { echo "::error::service must match ^[a-z0-9][a-z0-9_-]{1,80}\$"; exit 1; }
            n=$((n+1))
          done
          if [ "$n" -gt 1 ] && { [ -n "$KEEP_COMMITTED" ] || [ "$REINJECT" = "true" ]; }; then
            echo "::error::keep_committed / reinject_secret_mounts take exactly one service"; exit 1
          fi
          for v in "$COURIER_BEFORE" "$COURIER_AFTER"; do
            [ -z "$v" ] || printf '%s' "$v" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::courier_before/courier_after must be full shas"; exit 1; }
          done
          [ "$TARGET_REPO" = "cloudy-u-containers" ] || { echo "::error::repo must be cloudy-u-containers (this workflow's own repository)"; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloudy-t-infra
          path: infra
          sparse-checkout: |
            1_cicd
            1_cloud-configs/dist
            0_git
      - uses: actions/checkout@v4
        with:
          path: infra/a_solutions
          ref: main   # main's tip when the run starts (runs are serialised), not when it was queued
          fetch-depth: 2
      - name: Service directory must exist
        working-directory: infra/a_solutions
        run: |
          set -eu
          for SERVICE in $SERVICES; do
            [ -d "$SERVICE" ] && [ -f "$SERVICE/build.json" ] && [ -e "$SERVICE/build.sh" ] || { echo "::error::$SERVICE is not a service directory (needs build.json and build.sh)"; exit 1; }
          done
          echo "SRC_SHA=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
          echo "SRC_FULL=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SRC_PARENT=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: cachix/install-nix-action@v27
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -eu
          tgz="$RUNNER_TEMP/gitleaks.tgz"
          curl -sSfL -o "$tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf "$tgz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: build.sh build for the one service
        working-directory: infra/a_solutions
        run: |
          set -eu
          for SERVICE in $SERVICES; do
            echo "::group::build $SERVICE"
            (cd "$SERVICE" && bash ./build.sh build)
            echo "::endgroup::"
          done
      # Chained runs (the courier handed a push over) always reinject: nobody is there to pick the flag,
      # and the helper only restores secret mounts the COMMITTED compose already has (no-op for a service
      # without them). Without it a vault-secret service (e.g. dagu, 2026-11-18 run 44403379762) is
      # refused by the guard below and the chain falls back to shipping the stale source commit.
      - name: Put back the committed secret mounts (reinject_secret_mounts, always on a chained run)
        if: env.REINJECT == 'true' || env.COURIER_BEFORE != ''
        working-directory: infra/a_solutions
        run: |
          bash _shared/test/render-dist-reinject-secret-mounts.test.sh
          for SERVICE in $SERVICES; do bash _shared/render-dist-reinject-secret-mounts.sh . "$SERVICE"; done
      - name: Restore the paths declared keep_committed (vault-secret compose)
        working-directory: infra/a_solutions
        run: |
          set -eu
          SERVICE=$SERVICES   # keep_committed takes exactly one service (validated)
          for p in $KEEP_COMMITTED; do
            case "$p" in *..*|/*) echo "::error::bad keep_committed path $p"; exit 1;; esac
            git checkout -- "$SERVICE/dist/$p"
            echo "kept committed: $SERVICE/dist/$p"
          done
      - name: Only <service>/dist/ may have changed
        id: diff
        working-directory: infra/a_solutions
        run: |
          set -eu
          stray=""
          for SERVICE in $SERVICES; do rm -f -- "$SERVICE/build.log"; done   # the engine's own run log, not a render output
          changed=$(git status --porcelain --untracked-files=all | cut -c4-)
          if [ -z "$changed" ]; then echo "dist is fresh, nothing to commit"; echo "dirty=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          stray=$changed
          for SERVICE in $SERVICES; do stray=$(printf '%s\n' "$stray" | grep -v "^\"\?$SERVICE/dist/" || true); done
          if [ -n "$stray" ]; then echo "::error::the render changed paths outside <service>/dist/ ($SERVICES), refusing to commit:"; printf '%s\n' "$stray"; exit 1; fi
          printf '%s\n' "$changed" | head -40
          echo "dirty=true" >> "$GITHUB_OUTPUT"
      - name: Refuse a render that strips secret mounts (public checkout has no sops files)
        if: steps.diff.outputs.dirty == 'true'
        working-directory: infra/a_solutions
        run: |
          bash _shared/test/render-dist-secret-mounts-guard.test.sh
          for SERVICE in $SERVICES; do bash _shared/test/render-dist-secret-mounts-guard.sh . "$SERVICE"; done
      - name: Commit, leak-scan the diff, push
        id: push
        if: steps.diff.outputs.dirty == 'true'
        working-directory: infra/a_solutions
        run: |
          set -eu
          for SERVICE in $SERVICES; do git add -A -- "$SERVICE/dist"; done
          label=$(for SERVICE in $SERVICES; do printf '%s/dist ' "$SERVICE"; done | sed 's/ $//')
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "ci(render-dist): re-render $label from $SRC_SHA [skip ci]"
          [ -f .gitleaks.toml ] || { echo "::error::.gitleaks.toml missing"; exit 1; }
          gitleaks git --config .gitleaks.toml --log-opts="-1" --redact --no-banner --exit-code 1 --verbose .
          i=0
          until git push origin HEAD:main; do
            i=$((i+1)); [ "$i" -lt 4 ] || { echo "::error::push failed after retries"; exit 1; }
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" pull -q --rebase origin main
          done
          echo "pushed $(git rev-parse --short HEAD)"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The courier only ships commits whose dist matches src: this render commit, or the source commit
      # when the render was already fresh. On a chained run (the courier handed this push over) that
      # could not finish the render, hand back the source commit anyway, exactly what the courier would
      # have shipped before 2026-11-18: the change is announced and Ship's drift guard decides.
      - name: Dispatch the courier (dispatch-cloud-infra) at the commit whose dist matches src
        # courier=false (manual runs only) stops here: the render is committed, nothing ships (#1886).
        if: ${{ !cancelled() && steps.validate.outcome == 'success' && (inputs.courier != 'false' || env.COURIER_BEFORE != '') && (success() || env.COURIER_BEFORE != '') }}
        working-directory: infra/a_solutions
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_OK: ${{ job.status == 'success' }}
          PUSHED: ${{ steps.push.outputs.sha }}
        run: |
          set -euo pipefail
          before=${COURIER_BEFORE:-${SRC_PARENT:-}}
          if [ "$JOB_OK" = "true" ]; then
            after=${PUSHED:-$SRC_FULL}
            why=$([ -n "$PUSHED" ] && echo "render commit" || echo "dist already fresh")
          else
            after=${COURIER_AFTER:-${SRC_FULL:-}}
            why="render did not finish; source commit, Ship's drift guard decides"
            echo "::warning::render-dist failed; handing the source commit back to the courier so the change is not left unannounced"
          fi
          [ -n "$before" ] && [ -n "$after" ] || { echo "::error::no range to hand to the courier"; exit 1; }
          jq -n --arg b "$before" --arg a "$after" '{ref: "main", inputs: {before: $b, after: $a}}' \
          | gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/dispatch-cloud-infra.yml/dispatches" --input -
          echo "courier dispatched: ${before}..${after} (${why})"
          echo "### courier dispatched: \`${before}..${after}\` (${why})" >> "$GITHUB_STEP_SUMMARY"
