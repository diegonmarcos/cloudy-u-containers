name: cloud-run-images (linux/amd64 images for the Cloud Run registry)

# Cloud Run runs linux/amd64 only, while the fleet's VM images are arm64 (build.json docker.arch). This workflow builds
# the amd64 image of each Cloud Run service declared in cloudy-t-infra c_vps/vps_gcloud/src/terraform.json
# cloud_run_services (#1432 agy, #1433 finterminal-api, #1434 migration, #1429 scrappers-api). On push it BUILDS ONLY (proof the image
# builds); it pushes to GHCR only on a manual dispatch with push=true. It never deploys: Cloud Run pulls through the
# declared Artifact Registry remote repo, and the Terraform apply is a separate, owner-approved step.
on:
  push:
    branches: [main]
    paths:
      - 'user-ai_antigravity/src/**'
      - 'user-fin_capital-stack-finterminal-api/src/code/**'
      - 'user-fin_capital-stack-finterminal-web/dist/code/**'
      - 'user-data_scrappers-api/src/**'
      - '.github/workflows/cloud-run-images.yml'
  workflow_dispatch:
    inputs:
      service:
        description: "Service to build (all = every entry below)"
        type: choice
        options: [all, agy, capital-stack-finterminal-api, capital-stack-finterminal-web, scrappers-api]
        default: all
      push:
        description: "Push the image to ghcr.io (owner approval)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: cloud-run-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agy
            context: user-ai_antigravity/src
            dockerfile: user-ai_antigravity/src/Dockerfile
            image: ghcr.io/diegonmarcos/agy-cloudrun
          - name: capital-stack-finterminal-api
            context: user-fin_capital-stack-finterminal-api/src/code
            dockerfile: user-fin_capital-stack-finterminal-api/src/code/Dockerfile.native
            image: ghcr.io/diegonmarcos/capital-stack-finterminal-api-cloudrun
          - name: capital-stack-finterminal-web
            context: user-fin_capital-stack-finterminal-web/dist/code/arm64
            dockerfile: user-fin_capital-stack-finterminal-web/dist/code/arm64/Dockerfile
            image: ghcr.io/diegonmarcos/capital-stack-finterminal-web-cloudrun
          - name: scrappers-api
            context: user-data_scrappers-api/src
            dockerfile: user-data_scrappers-api/src/Dockerfile.cloudrun
            image: ghcr.io/diegonmarcos/scrappers-api-cloudrun
    steps:
      - name: Selected?
        id: sel
        run: |
          want="${{ github.event.inputs.service || 'all' }}"
          if [ "$want" = all ] || [ "$want" = "${{ matrix.name }}" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.sel.outputs.run == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.sel.outputs.run == 'true'
      - name: Log in to GHCR (dispatch with push only)
        if: steps.sel.outputs.run == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (push only on approved dispatch)
        if: steps.sel.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.push == 'true' }}
          tags: ${{ matrix.image }}:latest,${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
